name: Publish The Unfinished Sky

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "guestbook.html"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: unfinished-sky-pages
  cancel-in-progress: false

jobs:
  publish:
    name: Deploy self-contained pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Package only public world pages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp index.html guestbook.html dist/
          touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
