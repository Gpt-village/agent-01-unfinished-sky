name: Publish The Unfinished Sky

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "play-the-unfinished-sky.html"
      - "guestbook.html"
      - "source/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: unfinished-sky-pages
  cancel-in-progress: false

jobs:
  publish:
    name: Deploy self-contained pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Validate playable source before publishing
        shell: bash
        run: |
          set -euo pipefail
          node --check source/app.js
          python3 source/scripts/build_release.py --check
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import re, subprocess, tempfile

          class Inspector(HTMLParser):
              def __init__(self):
                  super().__init__(); self.ids=[]
              def handle_starttag(self,tag,attrs):
                  item=dict(attrs)
                  if 'id' in item: self.ids.append(item['id'])

          for path in [Path("index.html"), Path("source/index.html")]:
              html=path.read_text(encoding="utf-8")
              parser=Inspector();parser.feed(html);parser.close()
              assert len(set(parser.ids))==len(parser.ids), f"Duplicate IDs in {path}"
              for required in ["sky-canvas","visitor-grid","community-grid","community-count","commons-grid","commons-count","festival-grid","festival-count","sky-code","import-dialog","loom-gallery"]:
                  assert required in parser.ids, f"Missing {required} in {path}"
              assert "Festivals of the Sky" in html and "SKY7" in html, f"Unexpected game version in {path}"
              for script in re.findall(r"<script>(.*?)</script>",html,re.S|re.I):
                  with tempfile.NamedTemporaryFile("w",suffix=".js",encoding="utf-8") as tmp:
                      tmp.write(script);tmp.flush()
                      subprocess.run(["node","--check",tmp.name],check=True)
          assert "commonsDigits" in Path("source/app.js").read_text()
          assert "festivalDigits" in Path("source/app.js").read_text()
          print("Version 7 source validation passed.")
          PY
      - name: Package only public world pages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp index.html guestbook.html dist/
          touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
